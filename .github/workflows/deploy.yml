name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sheldonbakker/${{ vars.IMAGE_NAME }}
  DOTNET_VERSION: '10.0.x'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore FirearmStudio.slnx

      - name: Run tests
        run: dotnet test FirearmStudio.slnx --configuration Release --no-restore --logger "trx;LogFileName=tests.trx"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: xUnit Tests
          path: '**/tests.trx'
          reporter: dotnet-trx
          fail-on-error: false

  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore FirearmStudio.slnx

      - name: Build (enforces analyzer rules via TreatWarningsAsErrors)
        run: dotnet build FirearmStudio.slnx --configuration Release --no-restore

      - name: Format check
        run: dotnet format FirearmStudio.slnx --verify-no-changes --severity warn --no-restore

  build:
    runs-on: ubuntu-latest
    needs: [test, analyze]
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-cd
          ping: ${{ secrets.VM_HOST }}

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: STACK_ENV
          script: |
            set -euo pipefail
            cd /opt/docker/${{ vars.VM_DOCKER_FOLDER }}
            if [ -z "${STACK_ENV:-}" ]; then
              echo "STACK_ENV is empty; refusing to overwrite .env" >&2
              exit 1
            fi
            printf '%s' "$STACK_ENV" > .env.new
            chmod 640 .env.new
            mv .env.new .env
            chgrp docker .env
            docker compose pull
            docker compose up -d
        env:
          STACK_ENV: ${{ secrets.STACK_ENV }}
