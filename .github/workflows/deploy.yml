name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sheldonbakker/${{ vars.IMAGE_NAME }}
  DOTNET_VERSION: '10.0.x'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore FirearmStudio.slnx

      - name: Run tests
        env:
          TestDatabase__AdminConnection: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres;SSL Mode=Disable"
        run: dotnet test FirearmStudio.slnx --configuration Release --no-restore --filter "Category!=Performance" --logger "trx;LogFileName=tests.trx"

      - name: Publish test results
        uses: dorny/test-reporter@d61b558e8df85cb60d09ca3e5b09653b4477cea7
        if: success() || failure()
        with:
          name: xUnit Tests
          path: '**/tests.trx'
          reporter: dotnet-trx
          fail-on-error: false

  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore FirearmStudio.slnx

      - name: Build (enforces analyzer rules via TreatWarningsAsErrors)
        run: dotnet build FirearmStudio.slnx --configuration Release --no-restore

      - name: Format check
        run: dotnet format FirearmStudio.slnx --verify-no-changes --severity warn --no-restore

  build:
    runs-on: ubuntu-latest
    needs: [test, analyze]
    if: github.event_name != 'pull_request'
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Setup Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-cd
          ping: ${{ secrets.VM_HOST }}

      - name: Deploy to VM
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: STACK_ENV,DEPLOY_IMAGE
          script: |
            set -euo pipefail
            cd /opt/docker/${{ vars.VM_DOCKER_FOLDER }}
            if [ -z "${STACK_ENV:-}" ]; then
              echo "STACK_ENV is empty; refusing to overwrite .env" >&2
              exit 1
            fi
            printf '%s\n' "$STACK_ENV" | sed '/^FIREARM_IMAGE=/d' > .env.new
            printf 'FIREARM_IMAGE=%s\n' "$DEPLOY_IMAGE" >> .env.new
            chmod 640 .env.new
            mv .env.new .env
            chgrp docker .env
            docker compose pull
            docker compose up -d
        env:
          STACK_ENV: ${{ secrets.STACK_ENV }}
          DEPLOY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
