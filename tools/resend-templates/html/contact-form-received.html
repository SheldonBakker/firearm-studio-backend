<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New contact form submission</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;">
        <tr>
          <td style="background:#1f2937;padding:24px 32px;border-radius:8px 8px 0 0;">
            <span style="color:#ffffff;font-size:20px;font-weight:700;letter-spacing:-0.5px;">Firearm Studio</span>
          </td>
        </tr>
        <tr>
          <td style="background:#ffffff;padding:32px;border-radius:0 0 8px 8px;">
            <p style="margin:0 0 24px;font-size:16px;font-weight:600;color:#111827;">New contact form submission</p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:24px;border:1px solid #e5e7eb;border-radius:6px;overflow:hidden;">
              <tr>
                <td style="padding:12px 16px;background:#f9fafb;font-size:13px;font-weight:600;color:#374151;width:140px;border-bottom:1px solid #e5e7eb;">Name</td>
                <td style="padding:12px 16px;font-size:14px;color:#111827;border-bottom:1px solid #e5e7eb;">{{{SUBMITTER_NAME}}}</td>
              </tr>
              <tr>
                <td style="padding:12px 16px;background:#f9fafb;font-size:13px;font-weight:600;color:#374151;border-bottom:1px solid #e5e7eb;">Email</td>
                <td style="padding:12px 16px;font-size:14px;color:#111827;border-bottom:1px solid #e5e7eb;">{{{SUBMITTER_EMAIL}}}</td>
              </tr>
              <tr>
                <td style="padding:12px 16px;background:#f9fafb;font-size:13px;font-weight:600;color:#374151;">Company</td>
                <td style="padding:12px 16px;font-size:14px;color:#111827;">{{{SUBMITTER_COMPANY}}}</td>
              </tr>
            </table>
            <p style="margin:0 0 12px;font-size:13px;font-weight:600;color:#374151;text-transform:uppercase;letter-spacing:0.5px;">Message</p>
            <div style="padding:16px;background:#f9fafb;border-radius:6px;border:1px solid #e5e7eb;font-size:14px;color:#111827;line-height:1.6;">{{{MESSAGE_HTML}}}</div>
            <p style="margin:24px 0 0;font-size:14px;color:#6b7280;">You can reply directly to this email - your reply goes to the submitter.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 0;text-align:center;">
            <span style="color:#9ca3af;font-size:12px;">Firearm Studio - sent automatically</span>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
