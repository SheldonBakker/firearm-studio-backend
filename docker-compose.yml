services:
  api:
    image: ${FIREARM_IMAGE:-ghcr.io/sheldonbakker/firearm-studio-api:latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "5146"

      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      JwtSettings__Issuer: ${JwtSettings__Issuer}
      JwtSettings__SigningKey: ${JwtSettings__SigningKey}
      ApiKeySettings__Key: ${ApiKeySettings__Key}
      KlaviyoSettings__ApiKey: ${KlaviyoSettings__ApiKey}
      CredentialProtectionSettings__Key: ${CredentialProtectionSettings__Key}
      NotificationSettings__PublicBaseUrl: ${NotificationSettings__PublicBaseUrl}
    ports:
      - "5146:5146"
