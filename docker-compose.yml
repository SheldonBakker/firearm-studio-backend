services:
  api:
    image: ghcr.io/sheldonbakker/firearm-studio-api:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "5146"
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      SupabaseJwtSettings__Authority: ${SupabaseJwtSettings__Authority}
      ApiKeySettings__Key: ${ApiKeySettings__Key}
    ports:
      - "5146:5146"
