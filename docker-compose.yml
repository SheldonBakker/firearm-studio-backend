services:
  api:
    image: ${FIREARM_IMAGE:-ghcr.io/sheldonbakker/firearm-studio-api:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "5146"
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:5146:5146"
    networks:
      - default
      - dbnet

networks:
  default:
    name: firearm-studio-backend_default
  dbnet:
    external: true
